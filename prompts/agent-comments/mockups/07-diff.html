    note3: 'The left list shows A, M, D, R and +/− counts. A click scrolls the right side to that file. Unified and Side by side are diff2html’s two modes. Green and red line washes are not --deleteColor and not --themeColor.',
    note4: 'Refresh recalculates the diff from the current disk. An empty list says “No changes relative to HEAD”. A truncated patch says “First 5 MB shown”.',
    note5: 'The diff is an editor tab with an icon, not a file. The title “Turn changes” or “Working copy” follows the scope. Switching to guide.md leaves the document in place.',
    stTurn: 'turn, relative to HEAD', stWork: 'working copy, relative to HEAD',
    stEmpty: 'no changes relative to HEAD', stBig: 'first 5 MB shown',
    stDoc: 'file tab', stClosed: 'diff tab closed'
  }
}

function stored(key) {
  try { return sessionStorage.getItem(key) } catch (e) { return null }
}
function persist(key, value) {
  try { sessionStorage.setItem(key, value) } catch (e) { /* file:// */ }
}
function $(id) { return document.getElementById(id) }
function tr(key) { return I18N[state.lang][key] }
function el(tag, cls, text) {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (text != null) node.textContent = text
  return node
}
function filesWord(n) {
  if (state.lang === 'en') return n === 1 ? 'file' : 'files'
  const n10 = n % 10
  const n100 = n % 100
  if (n10 === 1 && n100 !== 11) return 'файл'
  if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return 'файла'
  return 'файлов'
}
function stats(file) {
  let add = 0
  let del = 0
  for (const hunk of file.hunks) {
    for (const line of hunk.lines) {
      if (line.type === 'add') add += 1
      if (line.type === 'del') del += 1
    }
  }
  return { add, del }
}
function sourceFiles() {
  if (state.scene === 'empty') return []
  return state.scope === 'turn' ? TURN : WORK
}
function shownFiles() {
  const files = sourceFiles()
  if (state.scene !== 'big') return files
  return files.map((file, index) => (index === 0 ? file : { ...file, hunks: [], cut: true }))
}

const state = {
  lang: stored('mt-mockup-lang') || 'ru',
  theme: stored('mt-mockup-theme') || 'light',
  scene: 'turn',
  scope: 'turn',
  view: 'unified',
  diffOpen: true,
  editorTab: 'diff',
  current: 'guide',
  fresh: false
}

function applyI18n() {
  document.documentElement.lang = state.lang
  document.title = tr('protoTitle')
  document.querySelectorAll('[data-i18n]').forEach((node) => {
    node.textContent = tr(node.getAttribute('data-i18n'))
  })
  document.querySelectorAll('[data-i18n-aria]').forEach((node) => {
    node.setAttribute('aria-label', tr(node.getAttribute('data-i18n-aria')))
  })
  $('theme-light').setAttribute('aria-pressed', String(state.theme === 'light'))
  $('theme-dark').setAttribute('aria-pressed', String(state.theme === 'dark'))
  $('lang-ru').setAttribute('aria-pressed', String(state.lang === 'ru'))
  $('lang-en').setAttribute('aria-pressed', String(state.lang === 'en'))
  document.querySelectorAll('[data-scene]').forEach((node) => {
    node.setAttribute('aria-pressed', String(node.getAttribute('data-scene') === state.scene))
  })
}

function scopeLabel(which, count) {
  const word = filesWord(count)
  const head = state.lang === 'ru' ? 'относительно HEAD' : 'relative to HEAD'
  if (which === 'turn') {
    const lead = state.lang === 'ru' ? 'Ход: 15:08' : 'Turn: 15:08'
    return lead + ', ' + count + ' ' + word + ', ' + head
  }
  const lead = state.lang === 'ru' ? 'Вся рабочая копия' : 'Entire working copy'
  return lead + ', ' + count + ' ' + word + ', ' + head
}

function renderTabs() {
  const bar = $('edittabs')
  bar.replaceChildren()
  const doc = el('button', 'filetab')
  doc.type = 'button'
  doc.id = 'tab-doc'
  doc.setAttribute('role', 'tab')
  doc.setAttribute('aria-selected', String(state.editorTab === 'doc'))
  doc.textContent = 'guide.md'
  doc.addEventListener('click', () => {
    state.editorTab = 'doc'
    apply()
  })
  bar.appendChild(doc)
  if (!state.diffOpen) return
  const tab = el('div', 'diff-tab filetab')
  tab.id = 'tab-diff'
  tab.setAttribute('role', 'tab')
  tab.setAttribute('aria-selected', String(state.editorTab === 'diff'))
  const name = el('button', 'tab-name')
  name.type = 'button'
  name.id = 'diff-title'
  name.innerHTML = DIFF_ICON
  name.appendChild(document.createTextNode(
    state.scope === 'turn' ? tr('tabTurn') : tr('tabWork')
  ))
  name.addEventListener('click', () => {
    state.editorTab = 'diff'
    apply()
  })
  const close = el('button', 'tab-x')
  close.type = 'button'
  close.innerHTML = X
  close.setAttribute('aria-label', tr('closeDiff'))
  close.addEventListener('click', () => {
    state.diffOpen = false
    state.editorTab = 'doc'
    apply()
  })
  tab.appendChild(name)
  tab.appendChild(close)
  bar.appendChild(tab)
}

function renderChoices() {
  const scope = $('scope-group')
  scope.replaceChildren()
  const turnCount = state.scene === 'empty' ? 0 : TURN.length
  const workCount = state.scene === 'empty' ? 0 : WORK.length
  ;[
    ['turn', scopeLabel('turn', turnCount)],
    ['work', scopeLabel('work', workCount)]
  ].forEach(([id, label]) => {
    const button = el('button', 'choice', label)
    button.type = 'button'
    button.setAttribute('aria-pressed', String(state.scope === id))
    button.addEventListener('click', () => {
      state.scope = id
      const files = sourceFiles()
      if (!files.some((file) => file.id === state.current)) state.current = files[0] ? files[0].id : ''
      apply()
    })
    scope.appendChild(button)
  })
  const view = $('view-group')
  view.replaceChildren()
  ;[
    ['unified', tr('unified')],
    ['side', tr('side')]
  ].forEach(([id, label]) => {
    const button = el('button', 'choice', label)
    button.type = 'button'
    button.setAttribute('aria-pressed', String(state.view === id))
    button.addEventListener('click', () => {
      state.view = id
      apply()
    })
    view.appendChild(button)
  })
}

function renderFiles(files) {
  const nav = $('files')
  nav.replaceChildren()
  files.forEach((file) => {
    const count = stats(file)
    const button = el('button', 'file')
    button.type = 'button'
    button.dataset.id = file.id
    if (file.id === state.current) button.setAttribute('aria-current', 'true')
    const kindName = tr('kind' + file.kind)
    button.setAttribute('aria-label', tr('fileLabel')
      .replace('{kind}', kindName)
      .replace('{path}', file.path)
      .replace('{add}', String(count.add))
      .replace('{del}', String(count.del)))
    const badge = el('span', 'badge', file.kind)
    badge.dataset.kind = file.kind
    badge.setAttribute('aria-hidden', 'true')
    const path = el('span', 'path', file.path)
    const stat = el('span', 'stat')
    stat.appendChild(el('span', 'plus', '+' + count.add))
    stat.appendChild(el('span', 'minus', '−' + count.del))
    button.append(badge, path, stat)
    button.addEventListener('click', () => selectFile(file.id))
    nav.appendChild(button)
  })
}

function lineCell(line, side) {
  const num = el('td', 'd2h-code-linenumber' + (side ? ' d2h-code-side-linenumber' : ''))
  const code = el('td')
  if (!line) {
    num.className += ' d2h-empty'
    code.className = 'd2h-empty'
    return [num, code]
  }
  const kind = line.type === 'add' ? 'ins' : line.type === 'del' ? 'del' : line.type === 'hunk' ? 'info' : 'cntx'
  num.classList.add('d2h-' + kind)
  code.classList.add('d2h-' + kind)
  const number = line.type === 'add' ? line.neu : line.type === 'del' ? line.old : (side === 'right' ? line.neu : line.old)
  if (line.type !== 'hunk' && number != null) num.textContent = String(number)
  const body = el('div', line.type === 'hunk' ? 'd2h-info-line' : 'd2h-code-line')
  if (line.type !== 'hunk') {
    const prefix = el('span', 'd2h-code-line-prefix', line.type === 'add' ? '+' : line.type === 'del' ? '-' : ' ')
    body.appendChild(prefix)
  }
  body.appendChild(document.createTextNode(line.text))
  code.appendChild(body)
  return [num, code]
}

function pair(lines) {
  const rows = []
  let index = 0
  while (index < lines.length) {
    const line = lines[index]
    if (line.type === 'ctx') {
      rows.push({ left: line, right: line })
      index += 1
      continue
    }
    const dels = []
    const adds = []
    while (index < lines.length && lines[index].type === 'del') dels.push(lines[index++])
    while (index < lines.length && lines[index].type === 'add') adds.push(lines[index++])
    const count = Math.max(dels.length, adds.length)
    for (let cursor = 0; cursor < count; cursor += 1) {
      rows.push({ left: dels[cursor] || null, right: adds[cursor] || null })
    }
  }
  return rows
}

function renderBlock(file) {
  const wrap = el('div', 'd2h-file-wrapper')
  wrap.id = 'blk-' + file.id
  const header = el('div', 'd2h-file-header')
  const name = el('span', 'd2h-file-name', file.oldPath ? file.oldPath + ' → ' + file.path : file.path)
  header.appendChild(name)
  const tag = el('span', 'd2h-tag', file.kind)
  header.appendChild(tag)
  wrap.appendChild(header)
  if (file.cut) {
    const table = el('table', 'd2h-diff-table')
    const row = el('tr')
    const cell = el('td', 'd2h-info cut-line', '…')
    cell.colSpan = state.view === 'side' ? 4 : 2
    row.appendChild(cell)
    table.appendChild(row)
    wrap.appendChild(table)
    return wrap
  }
  const table = el('table', 'd2h-diff-table' + (state.view === 'side' ? ' d2h-side' : ''))
  file.hunks.forEach((hunk) => {
    const info = el('tr')
    const cell = el('td', 'd2h-info')
    cell.colSpan = state.view === 'side' ? 4 : 2
    cell.appendChild(el('div', 'd2h-info-line', hunk.header))
    info.appendChild(cell)
    table.appendChild(info)
    if (state.view === 'unified') {
      hunk.lines.forEach((line) => {
        const row = el('tr')
        lineCell(line, '').forEach((node) => row.appendChild(node))
        table.appendChild(row)
      })
      return
    }
    pair(hunk.lines).forEach((paired) => {
      const row = el('tr')
      lineCell(paired.left, 'left').forEach((node) => row.appendChild(node))
      lineCell(paired.right, 'right').forEach((node) => row.appendChild(node))
      table.appendChild(row)
    })
  })
  wrap.appendChild(table)
  return wrap
}

function renderPane(files) {
  const pane = $('pane')
  pane.replaceChildren()
  files.forEach((file) => pane.appendChild(renderBlock(file)))
}

function scrollToCurrent() {
  const pane = $('pane')
  const target = document.getElementById('blk-' + state.current)
  if (!pane || !target) return
  pane.scrollTop = target.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop
}

function selectFile(id) {
  state.current = id
  document.querySelectorAll('.file').forEach((node) => {
    if (node.dataset.id === id) node.setAttribute('aria-current', 'true')
    else node.removeAttribute('aria-current')
  })
  scrollToCurrent()
}

function apply() {
  document.documentElement.dataset.theme = state.theme
  applyI18n()
  renderTabs()
  const showDiff = state.diffOpen && state.editorTab === 'diff'
  $('editor').hidden = showDiff
  $('diffview').hidden = !showDiff
  $('hint').textContent = tr('hint')
  $('refresh').textContent = tr('refresh')
  $('fresh').textContent = tr('fresh')
  $('fresh').hidden = !state.fresh
  $('banner').textContent = tr('banner')
  $('banner').hidden = state.scene !== 'big'
  $('empty').textContent = tr('empty')
  renderChoices()
  const files = shownFiles()
  const empty = files.length === 0
  $('split').hidden = empty
  $('empty').hidden = !empty
  if (!empty) {
    renderFiles(sourceFiles())
    renderPane(files)
    scrollToCurrent()
  }
  let key = 'stTurn'
  if (!state.diffOpen) key = 'stClosed'
  else if (state.editorTab === 'doc') key = 'stDoc'
  else if (state.scene === 'empty') key = 'stEmpty'
  else if (state.scene === 'big') key = 'stBig'
  else if (state.scope === 'work') key = 'stWork'
  $('status').textContent = tr(key)
}

function setScene(scene) {
  state.scene = scene
  state.scope = scene === 'work' || scene === 'empty' ? 'work' : 'turn'
  state.view = 'unified'
  state.diffOpen = true
  state.editorTab = 'diff'
  state.fresh = false
  state.current = scene === 'empty' ? '' : 'guide'
  apply()
}

document.querySelectorAll('[data-scene]').forEach((node) => {
  node.addEventListener('click', () => setScene(node.getAttribute('data-scene')))
})
$('theme-light').addEventListener('click', () => {
  state.theme = 'light'
  persist('mt-mockup-theme', 'light')
  apply()
})
$('theme-dark').addEventListener('click', () => {
  state.theme = 'dark'
  persist('mt-mockup-theme', 'dark')
  apply()
})
$('lang-ru').addEventListener('click', () => {
  state.lang = 'ru'
  persist('mt-mockup-lang', 'ru')
  apply()
})
$('lang-en').addEventListener('click', () => {
  state.lang = 'en'
  persist('mt-mockup-lang', 'en')
  apply()
})
$('refresh').addEventListener('click', () => {
  state.fresh = true
  apply()
})

setScene('turn')
</script>
</body>
</html>
