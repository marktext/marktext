<style>

  :root {

    --editorColor: #4d4d4d;
    --editorColor80: #333333;
    --editorColor50: #808080;
    --editorColor10: #e6e6e6;
    --editorColor04: rgba(0, 0, 0, 0.04);
    --editorBgColor: #fff;
    --iconColor: #6b737b;
    --sideBarColor: rgba(0, 0, 0, 0.6);
    --sideBarTitleColor: #000;
    --sideBarTextColor: rgba(0, 0, 0, 0.4);
    --sideBarBgColor: rgba(242, 242, 242, 0.9);
    --sideBarItemHoverBgColor: rgba(0, 0, 0, 0.04);
    --itemBgColor: rgba(255, 255, 255, 0.6);
    --floatBgColor: #fff;
    --floatBorderColor: rgba(0, 0, 0, 0.1);
    --h1Color: var(--editorColor80);
    --buttonPrimaryFontColor: #fff;
    --tagOrphanFg: #6d4e0c;
    --tagOrphanBg: rgba(214, 168, 32, 0.28);
    --tagReadFg: #7a1e1e;
    --tagReadBg: rgba(255, 105, 105, 0.22);
    --commentMarkBg: rgba(214, 168, 32, 0.28);
    --commentMarkUnderline: #8a6410;
  }
  html[data-theme="dark"] {
    --themeColor: #409eff;
    --themeColor20: rgba(64, 158, 255, 0.2);
    --editorColor: rgba(255, 255, 255, 0.7);
    --editorColor80: rgba(255, 255, 255, 0.8);
    --editorColor50: rgba(255, 255, 255, 0.5);
    --editorColor10: rgba(255, 255, 255, 0.1);
    --editorColor04: rgba(255, 255, 255, 0.04);
    --editorBgColor: #282828;
    --iconColor: rgba(255, 255, 255, 0.56);
    --sideBarColor: rgba(255, 255, 255, 0.6);
    --sideBarTitleColor: rgba(255, 255, 255, 0.8);
    --sideBarTextColor: rgba(255, 255, 255, 0.4);
    --sideBarBgColor: #232323;
    --sideBarItemHoverBgColor: rgba(255, 255, 255, 0.06);
    --itemBgColor: #3f3f3f;
    --floatBgColor: #3f3f3f;
    --floatBorderColor: rgba(255, 255, 255, 0.08);
    --h1Color: var(--editorColor80);
    --tagOrphanFg: #ffe08a;
    --tagOrphanBg: rgba(240, 196, 60, 0.22);
    --tagReadFg: #ffc1c1;
    --tagReadBg: rgba(255, 105, 105, 0.22);
    --commentMarkBg: rgba(240, 196, 60, 0.28);
    --commentMarkUnderline: #e2c15a;

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  body {
    background: var(--editorBgColor); color: var(--editorColor);
    font-family: "Open Sans", "Clear Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 1px solid var(--themeColor); outline-offset: 1px; }
  code, kbd { font-family: "DejaVu Sans Mono", "Source Code Pro", "Droid Sans Mono", monospace; font-size: 0.92em; }
  .proto {
    position: sticky; top: 0; z-index: 50;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 8px 14px; background: #ececec; color: #222;
    border-bottom: 1px solid #ccc; font-size: 13px;
  }
  html[data-theme="dark"] .proto { background: #1a1a1a; color: #ddd; border-bottom-color: #333; }
  .proto a { color: inherit; }
  .proto-title { font-weight: 600; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid #bbb; border-radius: 3px; overflow: hidden; }
  html[data-theme="dark"] .seg { border-color: #555; }
  .seg button { background: transparent; border: none; color: inherit; padding: 3px 8px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; }
  html[data-theme="dark"] .seg button[aria-pressed="true"] { background: #333; }
  .status { flex: 1 0 100%; margin: 0; color: #444; }
  html[data-theme="dark"] .status { color: #aaa; }
  .stage { display: flex; justify-content: center; padding: 20px; background: #c5c5c5; }
  html[data-theme="dark"] .stage { background: #101010; }
  .window {
    width: min(960px, 100%); height: 560px; display: flex; flex-direction: column;
    background: var(--editorBgColor); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28); overflow: hidden;
    position: relative;
  }
  .titlebar {
    height: 32px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: var(--sideBarBgColor); color: var(--sideBarColor); font-size: 12px;
  }
  .titlebar .path { margin-left: auto; color: var(--sideBarTextColor); }
  .body { flex: 1; min-height: 0; display: flex; }
  .editor { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tabs {
    height: 28px; flex: none; display: flex; align-items: stretch; gap: 2px; padding: 0 8px;
    background: var(--itemBgColor); font-size: 12px;
  }
  .tabs button {
    border: none; background: transparent; color: var(--editorColor); padding: 0 10px; cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--themeColor); color: var(--editorColor80); }
  .doc { flex: 1; min-height: 0; overflow: auto; }
  .doc-inner { max-width: 640px; margin: 0 auto; padding: 28px 16px; font-size: 16px; line-height: 1.7; }
  .doc-inner h1 { font-size: 1.6em; font-weight: 600; color: var(--h1Color); margin: 0 0 0.6em; }
  .mark { background: var(--commentMarkBg); box-shadow: inset 0 -1px 0 var(--commentMarkUnderline); }
  .panel {
    width: 280px; flex: none; display: flex; flex-direction: column; min-height: 0;
    background: var(--sideBarBgColor); color: var(--sideBarColor); border-left: 1px solid var(--itemBgColor);
  }
  .ptabs { height: 28px; flex: none; display: flex; }
  .ptabs button {
    position: relative; flex: 1; border: none; background: none; color: var(--sideBarColor);
    font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ptabs button[aria-selected="true"] { color: var(--sideBarTitleColor); background: var(--itemBgColor); }
  .ptabs button[aria-selected="true"]::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--themeColor);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--themeColor);
  }
  .count-badge, .tag {
    display: inline-block; font-size: 11px; font-weight: 600; line-height: 16px;
  }
  .count-badge {
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; text-align: center;
    background: var(--themeColor20); color: var(--editorColor80);
  }
  .tag { padding: 0 6px; border-radius: 2px; line-height: 18px; }
  .tag-orphan { color: var(--tagOrphanFg); background: var(--tagOrphanBg); }
  .tag-noreply { color: var(--editorColor80); background: var(--editorColor10); }
  .tag-closed { color: var(--editorColor); background: var(--editorColor04); box-shadow: inset 0 0 0 1px var(--editorColor10); }
  .tag-read { color: var(--tagReadFg); background: var(--tagReadBg); }
  .pbody { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  .hint, .block { margin: 0; font-size: 13px; line-height: 1.45; color: var(--sideBarColor); }
  .block { color: var(--tagReadFg); }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .field, .select {
    width: 100%; margin-top: 8px; height: 28px; padding: 0 8px;
    border: 1px solid var(--editorColor10); background: var(--editorBgColor); font-size: 13px;
  }
  .select:disabled { opacity: 0.7; }
  .primary, .btn, .danger {
    border: none; border-radius: 2px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  .primary { background: var(--themeColor); color: var(--buttonPrimaryFontColor); }
  .primary:disabled, .btn:disabled { opacity: 0.4; cursor: default; }
  .btn { background: transparent; border: 1px solid var(--editorColor10); color: var(--editorColor80); }
  .danger { background: var(--tagReadBg); color: var(--tagReadFg); }
  .term {
    height: 28px; flex: none; display: flex; align-items: center; padding: 0 10px;
    border-top: 1px solid var(--itemBgColor); background: var(--sideBarBgColor);
    color: var(--sideBarTextColor); font-size: 12px;
  }
  .shade {
    position: absolute; inset: 32px 0 0; background: rgba(0, 0, 0, 0.35);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .dialog {
    width: min(420px, 100%); padding: 16px; background: var(--floatBgColor);
    color: var(--editorColor); border: 1px solid var(--floatBorderColor);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }
  .dialog p { margin: 0 0 14px; line-height: 1.45; }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .closed {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; color: var(--editorColor80);
  }
  .keys { flex: 1; min-height: 0; display: flex; }
  .side {
    width: 220px; flex: none; background: var(--sideBarBgColor); padding-top: 16px;
  }
  .side h3 { margin: 0 0 12px; font-size: 18px; font-weight: normal; text-align: center; color: var(--sideBarColor); }
  .side .item {
    height: 38px; display: flex; align-items: center; padding: 0 16px;
    color: var(--sideBarTitleColor); font-size: 16px; box-shadow: inset 4px 0 0 var(--themeColor);
  }
  .keymain { flex: 1; min-width: 0; overflow: auto; padding: 16px 20px 24px; }
  .keymain h4 { margin: 0 0 8px; font-size: 18px; font-weight: 500; }
  .keymain .lead { margin: 0 0 12px; font-size: 13px; color: var(--editorColor50); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--editorColor10); vertical-align: middle; }
  th { color: var(--editorColor50); font-weight: 500; }
  .iconbtn {
    width: 28px; height: 28px; padding: 0; border: none; background: none;
    color: var(--iconColor); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn svg { width: 14px; height: 14px; display: block; }
  .iconbtn:disabled { opacity: 0.35; cursor: default; }
  .ring, .iconbtn:focus, .dialog button:focus, .dialog input:focus {
    outline: 1px solid var(--themeColor); outline-offset: 1px;
  }
  .saved { margin: 8px 0 0; font-size: 12px; color: var(--editorColor50); }
  .badges { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 28px 32px; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .icon-row { display: flex; gap: 8px; }
  .matrix { max-width: 760px; margin: 0 auto; padding: 8px 24px 0; line-height: 1.5; }
  .matrix p { margin: 0 0 0.4em; }
  .matrix strong { color: var(--editorColor80); }
  .notes { max-width: 760px; margin: 0 auto; padding: 8px 24px 64px; line-height: 1.55; }
  .notes h2 { font-size: 16px; font-weight: 600; color: var(--editorColor80); margin: 24px 0 8px; }
  .notes ol { margin: 0; padding-left: 1.2em; }
  .notes li { margin: 0 0 0.55em; }
</style>
</head>

</header>
<div class="stage">

</div>
<section class="matrix" id="matrix"></section>

function stored(key) {
  try { return sessionStorage.getItem(key) } catch (e) { return null }
}
function persist(key, value) {
  try { sessionStorage.setItem(key, value) } catch (e) { /* file:// */ }
}
function $(id) { return document.getElementById(id) }
function tr(key) { return I18N[state.lang][key] }
function fill(key, map) {
  return tr(key).replace(/\{(\w+)\}/g, (_, name) => map[name] == null ? '' : String(map[name]))
}
function el(tag, cls, text) {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (text != null) node.textContent = text
  return node
}
function svg(name) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  node.setAttribute('viewBox', '0 0 16 16')
  node.setAttribute('aria-hidden', 'true')
  node.innerHTML = ICONS[name]
  return node
}
function defaults() {
  const map = {}
  KEYS.forEach((row) => { map[row.id] = row.def })
  return map
}
function showKey(value) {
  if (!value) return tr('unbound')
  if (state.lang === 'ru') return value.replace('Down', '↓').replace('Up', '↑')
  return value
}

const state = {
  lang: stored('mt-mockup-lang') || 'ru',
  theme: stored('mt-mockup-theme') || 'light',
  scene: 'off',
  panel: 'comments',
  resolved: '',
  path: '',
  keys: defaults(),
  editing: '',
  pending: '',
  keyError: '',
  saved: false,
  focusCancel: false,
  focusIcon: false
}

function applyI18n() {
  document.documentElement.lang = state.lang
  document.title = tr('protoTitle')
  document.querySelectorAll('[data-i18n]').forEach((node) => {
    node.textContent = tr(node.getAttribute('data-i18n'))
  })
  document.querySelectorAll('[data-i18n-aria]').forEach((node) => {
    node.setAttribute('aria-label', tr(node.getAttribute('data-i18n-aria')))
  })
  $('theme-light').setAttribute('aria-pressed', String(state.theme === 'light'))
  $('theme-dark').setAttribute('aria-pressed', String(state.theme === 'dark'))
  $('lang-ru').setAttribute('aria-pressed', String(state.lang === 'ru'))
  $('lang-en').setAttribute('aria-pressed', String(state.lang === 'en'))
  document.querySelectorAll('[data-scene]').forEach((node) => {
    node.setAttribute('aria-pressed', String(node.getAttribute('data-scene') === state.scene))
  })
}

function tabs(bar, withFile) {
  if (withFile) {
    const file = el('button', '', tr('file'))
    file.type = 'button'
    file.setAttribute('aria-pressed', 'true')
    bar.appendChild(file)
  }
}

function doc(mark) {
  const box = el('div', 'doc')
  const inner = el('div', 'doc-inner')
  inner.appendChild(el('h1', '', tr('docTitle')))
  const p = el('p')
  if (mark) {
    const span = el('span', 'mark', tr('doc'))
    p.appendChild(span)
  } else p.textContent = tr('doc')
  inner.appendChild(p)
  box.appendChild(inner)
  return box
}

function panelShell() {
  const panel = el('aside', 'panel')
  const tabs = el('div', 'ptabs')
  tabs.setAttribute('role', 'tablist')
  ;['comments', 'chat'].forEach((id) => {
    const button = el('button', '', tr(id))
    button.type = 'button'
    button.setAttribute('role', 'tab')
    button.setAttribute('aria-selected', String(state.panel === id))
    if (id === 'comments' && state.scene !== 'nogit') {
      button.appendChild(document.createTextNode(' '))
      button.appendChild(el('span', 'count-badge', '2'))
    }
    if (id === 'chat' && state.scene === 'turn') {
      const dot = el('span', 'dot')
      dot.setAttribute('aria-hidden', 'true')
      button.appendChild(dot)
      button.setAttribute('aria-label', tr('chat') + ', ' + tr('turnDot'))
    }
    button.addEventListener('click', () => { state.panel = id; apply() })
    tabs.appendChild(button)
  })
  panel.appendChild(tabs)
  return panel
}

function renderEditor(root) {
  const scene = state.scene
  const title = el('div', 'titlebar')
  title.appendChild(document.createTextNode('MarkText'))
  if (scene !== 'off' && scene !== 'nogit') title.appendChild(el('span', 'path', state.path || tr('path')))
  root.appendChild(title)
  if (scene === 'close' && state.resolved === 'closed') {
    root.appendChild(el('div', 'closed', tr('closed')))
    return
  }
  const body = el('div', 'body')
  const editor = el('div', 'editor')
  const bar = el('div', 'tabs')
  tabs(bar, true)
  editor.appendChild(bar)
  const showMark = scene !== 'off' && scene !== 'nogit' && state.resolved !== 'deleted'
  editor.appendChild(doc(showMark))
  body.appendChild(editor)
  if (scene !== 'off') body.appendChild(renderPanel())
  root.appendChild(body)
  let term = null
  if (scene !== 'off' && scene !== 'nogit' && !(scene === 'folder' && state.resolved === 'switched')) {
    term = el('div', 'term', tr('term'))
    root.appendChild(term)
  }
  if ((scene === 'del' || scene === 'folder' || scene === 'close') && !state.resolved) {
    body.inert = true
    if (term) term.inert = true
    root.appendChild(renderDialog())
  }
}

function renderPanel() {
  const panel = panelShell()
  const body = el('div', 'pbody')
  const scene = state.scene
  if (scene === 'nogit') body.appendChild(el('p', 'hint', tr('nogit')))
  else if (scene === 'missing' && state.panel === 'chat') body.appendChild(el('p', 'block', tr('missing')))
  else if (scene === 'nomodels' && state.panel === 'chat') {
    const label = el('label', 'hint', tr('model'))
    label.htmlFor = 'model'
    body.appendChild(label)
    const select = el('select', 'select')
    select.id = 'model'
    select.disabled = true
    select.setAttribute('aria-label', tr('model'))
    select.appendChild(el('option', '', tr('noModelsOpt')))
    body.appendChild(select)
    const refresh = el('button', 'btn', tr('refresh'))
    refresh.type = 'button'
    refresh.style.marginTop = '8px'
    body.appendChild(refresh)
    body.appendChild(el('p', 'block', tr('noModels')))
  } else if (scene === 'turn' && state.panel === 'chat') {
    const stop = el('button', 'danger', tr('stop'))
    stop.type = 'button'
    body.appendChild(stop)
    body.appendChild(el('p', 'hint', tr('turnHint')))
  } else if (state.resolved === 'deleted' && scene === 'del') {
    body.appendChild(el('p', 'hint', tr('deleted')))
  } else if (state.resolved === 'switched' && scene === 'folder') {
    body.appendChild(el('p', 'hint', tr('folderDone')))
  } else {
    body.appendChild(el('p', 'hint', tr('quote')))
    const blocked = scene === 'missing' || scene === 'nomodels' || scene === 'turn'
    const all = el('button', 'primary', tr('sendAll'))
    all.type = 'button'
    all.disabled = blocked
    all.style.marginTop = '10px'
    const one = el('button', 'btn', tr('sendOne'))
    one.type = 'button'
    one.disabled = blocked
    one.style.marginTop = '8px'
    body.appendChild(all)
    body.appendChild(one)
    if (blocked) body.appendChild(el('p', 'hint', scene === 'missing' ? tr('missing') : scene === 'nomodels' ? tr('noModels') : tr('turnHint')))
  }
  panel.appendChild(body)
  return panel
}

function renderDialog() {
  const scene = state.scene
  const shade = el('div', 'shade')
  const dialog = el('div', 'dialog')
  dialog.setAttribute('role', 'dialog')
  dialog.setAttribute('aria-modal', 'true')
  const text = scene === 'del' ? tr('delText') : scene === 'folder' ? tr('folderText') : tr('closeText')
  const p = el('p', '', text)
  p.id = 'dlg-text'
  dialog.setAttribute('aria-labelledby', 'dlg-text')
  dialog.appendChild(p)
  const actions = el('div', 'actions')
  const yes = el('button', scene === 'del' ? 'danger' : 'primary', scene === 'del' ? tr('delYes') : scene === 'folder' ? tr('folderYes') : tr('closeYes'))
  yes.type = 'button'
  yes.addEventListener('click', () => {
    state.resolved = scene === 'del' ? 'deleted' : scene === 'folder' ? 'switched' : 'closed'
    if (scene === 'folder') state.path = tr('pathNext')
    apply()
  })
  const no = el('button', 'btn ring', tr('cancel'))
  no.type = 'button'
  no.id = 'dlg-cancel'
  no.addEventListener('click', () => { state.resolved = 'cancelled'; apply() })
  actions.append(yes, no)
  dialog.appendChild(actions)
  dialog.addEventListener('focusin', (event) => {
    const target = event.target.closest && event.target.closest('button, input')
    if (!target) return
    dialog.querySelectorAll('.ring').forEach((node) => node.classList.remove('ring'))
    target.classList.add('ring')
  })
  shade.appendChild(dialog)
  return shade
}

function renderKeys(root) {
  const wrap = el('div', 'keys')
  const side = el('aside', 'side')
  side.appendChild(el('h3', '', tr('pref')))
  side.appendChild(el('div', 'item', tr('keyPage')))
  wrap.appendChild(side)
  const main = el('div', 'keymain')
  main.appendChild(el('h4', '', tr('keyPage')))
  main.appendChild(el('p', 'lead', tr('keyLead')))
  const table = el('table')
  const head = el('tr')
  ;['colCmd', 'colKey', 'colOpt'].forEach((key) => head.appendChild(el('th', '', tr(key))))
  table.appendChild(head)
  KEYS.forEach((row) => {
    const trRow = el('tr')
    trRow.appendChild(el('td', '', tr(row.id)))
    trRow.appendChild(el('td', '', showKey(state.keys[row.id])))
    const actions = el('td')
    ;[
      ['edit', () => { state.editing = row.id; state.pending = ''; state.keyError = ''; state.saved = false; apply() }],
      ['reset', () => { state.keys[row.id] = row.def; state.saved = false; apply() }],
      ['unbind', () => { state.keys[row.id] = ''; state.saved = false; apply() }]
    ].forEach(([icon, onClick]) => {
      const button = el('button', 'iconbtn')
      button.type = 'button'
      button.appendChild(svg(icon))
      button.setAttribute('aria-label', fill(icon, { name: tr(row.id) }))
      button.addEventListener('click', onClick)
      actions.appendChild(button)
    })
    trRow.appendChild(actions)
    table.appendChild(trRow)
  })
  main.appendChild(table)
  const save = el('button', 'primary', tr('save'))
  save.type = 'button'
  save.style.marginTop = '12px'
  save.addEventListener('click', () => { state.saved = true; apply() })
  const restore = el('button', 'btn', tr('restore'))
  restore.type = 'button'
  restore.style.marginLeft = '8px'
  restore.addEventListener('click', () => { state.keys = defaults(); state.saved = false; apply() })
  main.appendChild(save)
  main.appendChild(restore)
  if (state.saved) main.appendChild(el('p', 'saved', tr('saved')))
  wrap.appendChild(main)
  root.appendChild(wrap)
  if (state.editing) {
    wrap.inert = true
    root.appendChild(renderKeyDialog())
  }
}

function renderKeyDialog() {
  const shade = el('div', 'shade')
  const dialog = el('div', 'dialog')
  dialog.setAttribute('role', 'dialog')
  dialog.setAttribute('aria-modal', 'true')
  dialog.appendChild(el('p', '', tr('keyPrompt')))
  const input = document.createElement('input')
  input.className = 'field'
  input.id = 'key-input'
  input.readOnly = true
  input.value = state.pending
  input.setAttribute('aria-label', tr('keyPrompt'))
  dialog.appendChild(input)
  dialog.appendChild(el('p', 'hint', state.keyError || tr('keyHelp')))
  const actions = el('div', 'actions')
  const save = el('button', 'primary', tr('save'))
  save.type = 'button'
  save.disabled = !state.pending || !!state.keyError
  save.addEventListener('click', () => {
    state.keys[state.editing] = state.pending
    state.editing = ''
    state.pending = ''
    state.saved = false
    apply()
  })
  const cancel = el('button', 'btn', tr('cancel'))
  cancel.type = 'button'
  cancel.addEventListener('click', () => { state.editing = ''; state.pending = ''; state.keyError = ''; apply() })
  actions.append(save, cancel)
  dialog.appendChild(actions)
  shade.appendChild(dialog)
  return shade
}

function renderBadges(root) {
  const box = el('div', 'badges')
  const row = el('div', 'badge-row')
  row.appendChild(el('span', 'count-badge', '6'))
  row.appendChild(el('span', 'tag tag-orphan', tr('badgeOrphan')))
  row.appendChild(el('span', 'tag tag-noreply', tr('badgeNo')))
  row.appendChild(el('span', 'tag tag-closed', tr('badgeClosed')))
  row.appendChild(el('span', 'tag tag-read', tr('badgeRead')))
  box.appendChild(row)
  const icons = el('div', 'icon-row')
  const comment = el('button', 'iconbtn')
  comment.type = 'button'
  comment.id = 'focus-icon'
  comment.classList.add('ring')
  comment.appendChild(svg('comment'))
  comment.setAttribute('aria-label', tr('commentBtn'))
  const close = el('button', 'iconbtn')
  close.type = 'button'
  close.appendChild(svg('unbind'))
  close.setAttribute('aria-label', tr('closeBtn'))
  icons.append(comment, close)
  icons.addEventListener('focusin', (event) => {
    icons.querySelectorAll('.ring').forEach((node) => node.classList.remove('ring'))
    if (event.target.classList && event.target.classList.contains('iconbtn')) event.target.classList.add('ring')
  })
  box.appendChild(icons)
  root.appendChild(box)
}

function renderMatrix() {
  const map = {
    off: ['offH', 'offI', 'offT'],
    nogit: ['gitH', 'gitI', 'nogit'],
    missing: ['missH', 'missI', 'missing'],
    nomodels: ['modelH', 'modelI', 'noModels'],
    turn: ['turnH', 'turnI', 'turnHint'],
    del: ['delH', 'delI', 'delT'],
    folder: ['folderH', 'folderI', 'folderText'],
    close: ['closeH', 'closeI', 'closeText'],
    keys: ['keysH', 'keysI', 'keysT'],
    badges: ['badgeH', 'badgeI', 'badgeT']
  }
  const [hidden, idle, tip] = map[state.scene]
  const box = $('matrix')
  box.replaceChildren()
  ;[['hid', hidden], ['idle', idle], ['tip', tip]].forEach(([label, text]) => {
    const p = el('p')
    p.appendChild(el('strong', '', tr(label) + ': '))
    p.appendChild(document.createTextNode(tr(text)))
    box.appendChild(p)
  })
}

function render() {
  const root = $('app')
  root.replaceChildren()
  if (state.scene === 'keys') renderKeys(root)
  else if (state.scene === 'badges') renderBadges(root)
  else renderEditor(root)
  renderMatrix()
  if (state.focusCancel) {
    const cancel = $('dlg-cancel')
    if (cancel) cancel.focus({ focusVisible: true })
    state.focusCancel = false
  }
  if (state.focusIcon) {
    const icon = $('focus-icon')
    if (icon) icon.focus({ focusVisible: true })
    state.focusIcon = false
  }
  if (state.editing) {
    const input = $('key-input')
    if (input) input.focus({ focusVisible: true })
  }
}

function apply() {
  document.documentElement.dataset.theme = state.theme
  applyI18n()
  render()
  const names = {
    off: 'stOff', nogit: 'stNogit', missing: 'stMissing', nomodels: 'stNoModels', turn: 'stTurn',
    del: 'stDel', folder: 'stFolder', close: 'stClose', keys: 'stKeys', badges: 'stBadges'
  }
  $('status').textContent = tr(names[state.scene])
}

function setScene(scene) {
  state.scene = scene
  state.resolved = ''
  state.path = tr('path')
  state.editing = ''
  state.pending = ''
  state.keyError = ''
  state.saved = false
  state.panel = scene === 'missing' || scene === 'nomodels' ? 'chat' : 'comments'
  state.focusCancel = scene === 'del' || scene === 'folder' || scene === 'close'
  state.focusIcon = scene === 'badges'
  apply()
}

function onKey(e) {
  if (!state.editing) return
  if (e.key === 'Escape') {
    state.editing = ''
    state.pending = ''
    state.keyError = ''
    apply()
    return
  }
  if (e.key === 'Tab') return
  e.preventDefault()
  const mods = []
  if (e.ctrlKey || e.metaKey) mods.push('Ctrl')
  if (e.altKey) mods.push('Alt')
  if (e.shiftKey) mods.push('Shift')
  if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) {
    state.pending = mods.join('+')
    state.keyError = tr('keyBad')
    apply()
    return
  }
  let key = e.key
  if (key === 'ArrowDown') key = 'Down'
  else if (key === 'ArrowUp') key = 'Up'
  else if (key === 'ArrowLeft') key = 'Left'
  else if (key === 'ArrowRight') key = 'Right'
  else if (key === ' ') key = 'Space'
  else if (key.length === 1) key = key.toUpperCase()
  const accel = mods.concat(key).join('+')
  const taken = KEYS.find((row) => row.id !== state.editing && state.keys[row.id] === accel)
  state.pending = accel
  state.keyError = mods.length === 0 ? tr('keyBad') : taken ? fill('keyUsed', { name: tr(taken.id) }) : ''
  apply()
}

document.querySelectorAll('[data-scene]').forEach((node) => {
  node.addEventListener('click', () => setScene(node.getAttribute('data-scene')))
})
$('theme-light').addEventListener('click', () => {
  state.theme = 'light'
  persist('mt-mockup-theme', 'light')
  apply()
})
$('theme-dark').addEventListener('click', () => {
  state.theme = 'dark'
  persist('mt-mockup-theme', 'dark')
  apply()
})
$('lang-ru').addEventListener('click', () => {
  state.lang = 'ru'
  persist('mt-mockup-lang', 'ru')
  apply()
})
$('lang-en').addEventListener('click', () => {
  state.lang = 'en'
  persist('mt-mockup-lang', 'en')
  apply()
})
document.addEventListener('keydown', onKey)

setScene('off')
</script>
</body>
</html>
