  }
  .switch-label { font-size: 14px; }
  .switch-note { margin: 0 0 8px; font-size: 12px; font-style: italic; color: var(--editorColor80); }
  .switch {
    width: 36px; height: 18px; border-radius: 9px; border: 2px solid var(--iconColor);
    background: transparent; position: relative; cursor: pointer; padding: 0; flex: none;
  }
  .switch::after {
    content: ""; position: absolute; top: 1px; left: 2px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--iconColor);
  }
  .switch[aria-checked="true"] { border-color: var(--themeColor); background: var(--themeColor); }
  .switch[aria-checked="true"]::after { left: 18px; background: #fff; }

  .use input { accent-color: var(--themeColor); }

  .field { display: block; margin: 0 0 4px; font-size: 13px; color: var(--editorColor80); }
  .pathrow { display: flex; gap: 8px; align-items: center; }
  .pathrow input, .shell-input {

  .textbtn {

  .st { margin: 8px 0 0; font-size: 13px; }
  .st.ok { color: var(--diffInsFg); }
  .st.bad { color: var(--tagReadFg); }
  .models { margin-top: 10px; }
  .models-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .models-head span { font-size: 13px; color: var(--editorColor80); }
  .models ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .models li {

  }
  .help { margin: 8px 0 0; font-size: 12px; font-style: italic; color: var(--editorColor80); line-height: 1.5; }
  .stub p { margin: 8px 0 0; color: var(--editorColor50); }
  .notes { max-width: 760px; margin: 0 auto; padding: 8px 24px 64px; line-height: 1.55; }

function stored(key) {
  try { return sessionStorage.getItem(key) } catch (e) { return null }
}
function persist(key, value) {
  try { sessionStorage.setItem(key, value) } catch (e) { /* file:// */ }
}
function $(id) { return document.getElementById(id) }
function tr(key) { return I18N[state.lang][key] }
function fill(key, map) {
  return tr(key).replace(/\{(\w+)\}/g, (_, name) => map[name] == null ? '' : String(map[name]))
}
function el(tag, cls, text) {
  const node = document.createElement(tag)
  if (cls) node.className = cls
  if (text != null) node.textContent = text
  return node
}
function svg(name) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
  node.setAttribute('viewBox', '0 0 16 16')
  node.setAttribute('aria-hidden', 'true')
  node.innerHTML = ICONS[name]
  return node
}

const state = {
  lang: stored('mt-mockup-lang') || 'ru',
  theme: stored('mt-mockup-theme') || 'light',
  scene: 'ready',
  page: 'agent',
  query: '',
  enabled: true,
  shell: '',
  active: 'opencode',
  turning: false,
  cards: {},
  live: ''
}

function applyI18n() {
  document.documentElement.lang = state.lang
  document.title = tr('protoTitle')
  document.querySelectorAll('[data-i18n]').forEach((node) => {
    node.textContent = tr(node.getAttribute('data-i18n'))
  })
  document.querySelectorAll('[data-i18n-aria]').forEach((node) => {
    node.setAttribute('aria-label', tr(node.getAttribute('data-i18n-aria')))
  })
  $('theme-light').setAttribute('aria-pressed', String(state.theme === 'light'))
  $('theme-dark').setAttribute('aria-pressed', String(state.theme === 'dark'))
  $('lang-ru').setAttribute('aria-pressed', String(state.lang === 'ru'))
  $('lang-en').setAttribute('aria-pressed', String(state.lang === 'en'))
  document.querySelectorAll('[data-scene]').forEach((node) => {
    node.setAttribute('aria-pressed', String(node.getAttribute('data-scene') === state.scene))
  })
  $('pref-title').textContent = tr('prefTitle')
  $('q').placeholder = tr('search')
  $('q').setAttribute('aria-label', tr('searchLabel'))
}

function renderCats() {
  const box = $('cats')
  box.replaceChildren()
  const q = state.query.trim().toLowerCase()
  const hits = CATS.filter((cat) => !q || cat.ru.toLowerCase().includes(q) || cat.en.toLowerCase().includes(q))
  if (!hits.length) {
    box.appendChild(el('p', 'none', tr('noHits')))
    return
  }
  hits.forEach((cat) => {
    const button = el('button', 'cat' + (state.page === cat.id ? ' active' : ''))
    button.type = 'button'
    button.appendChild(svg(cat.id))
    button.appendChild(document.createTextNode(state.lang === 'ru' ? cat.ru : cat.en))
    button.addEventListener('click', () => {
      state.page = cat.id
      apply()
    })
    box.appendChild(button)
  })
}

function statusNode(id, card) {
  const meta = META[id]
  if (card.status === 'found') {
    return el('p', 'st ok', fill('found', { bin: card.bin }))
  }
  const key = card.status === 'login' ? 'login' : card.status === 'nomodels' ? 'nomodels' : 'missing'
  return el('p', 'st bad', fill(key, { cmd: '`' + meta.cmd + '`', name: meta.title }))
}

function renderCard(id) {
  const meta = META[id]
  const data = state.cards[id]
  const cardNode = el('section', 'card' + (state.active === id ? ' used' : '') + (state.turning ? ' locked' : ''))
  const head = el('div', 'card-head')
  head.appendChild(el('h6', '', meta.title))
  const use = el('label', 'use')
  const radio = document.createElement('input')
  radio.type = 'radio'
  radio.name = 'harness'
  radio.checked = state.active === id
  radio.disabled = state.turning
  radio.setAttribute('aria-label', fill('useNamed', { name: meta.title }))
  radio.addEventListener('change', () => {
    if (state.turning) return
    state.active = id
    apply()
  })
  use.appendChild(radio)
  use.appendChild(document.createTextNode(tr('use')))
  head.appendChild(use)
  cardNode.appendChild(head)

  const pathLabel = el('label', 'field', tr('path'))
  pathLabel.htmlFor = 'path-' + id
  cardNode.appendChild(pathLabel)
  const row = el('div', 'pathrow')
  const input = document.createElement('input')
  input.id = 'path-' + id
  input.type = 'text'
  input.value = data.path
  input.placeholder = fill('pathPh', { cmd: meta.cmd })
  input.spellcheck = false
  input.addEventListener('input', () => { state.cards[id].path = input.value })
  const browse = el('button', 'textbtn', tr('browse'))
  browse.type = 'button'
  browse.setAttribute('aria-label', fill('browseNamed', { name: meta.title }))
  browse.addEventListener('click', () => {
    state.cards[id].path = '/usr/local/bin/' + meta.cmd
    state.live = tr('livePicked')
    apply()
  })
  row.append(input, browse)
  cardNode.appendChild(row)
  cardNode.appendChild(statusNode(id, data))

  const check = el('button', 'textbtn', tr('check'))
  check.type = 'button'
  check.style.marginTop = '8px'
  check.setAttribute('aria-label', fill('checkNamed', { name: meta.title }))
  check.addEventListener('click', () => checkCard(id))
  cardNode.appendChild(check)

  const models = el('div', 'models')
  const modelsHead = el('div', 'models-head')
  modelsHead.appendChild(el('span', '', tr('models')))
  const refresh = el('button', 'textbtn', tr('refresh'))
  refresh.type = 'button'
  refresh.setAttribute('aria-label', fill('refreshNamed', { name: meta.title }))
  refresh.addEventListener('click', () => refreshCard(id))
  modelsHead.appendChild(refresh)
  models.appendChild(modelsHead)
  const list = el('ul')
  list.setAttribute('aria-label', fill('modelsLabel', { name: meta.title }))
  data.models.forEach((model) => list.appendChild(el('li', '', model)))
  if (data.models.length) models.appendChild(list)
  cardNode.appendChild(models)
  return cardNode
}

function checkCard(id) {
  const data = state.cards[id]
  const meta = META[id]
  if (data.status === 'login') state.live = tr('liveLogin')
  else if (data.status === 'nomodels') state.live = fill('liveStillNoModels', { name: meta.title })
  else if (data.status === 'missing' && !data.path.trim()) state.live = fill('liveStillMissing', { cmd: meta.cmd })
  else if (data.status === 'missing') {
    data.status = 'found'
    data.bin = data.path.trim()
    data.models = id === 'pi' ? ['pi/gpt-4.1'] : id === 'cursor' ? ['cursor/auto'] : ['opencode/big-pickle']
    state.live = tr('liveFound')
  } else state.live = tr('liveChecked')
  apply()
}

function refreshCard(id) {
  const data = state.cards[id]
  const meta = META[id]
  state.live = data.models.length ? tr('liveRefreshed') : fill('liveNoModels', { name: meta.title })
  apply()
}

function renderPage() {
  const root = $('setting')
  root.replaceChildren()
  if (state.page !== 'agent') {
    const cat = CATS.find((item) => item.id === state.page)
    const stub = el('div', 'stub')
    stub.appendChild(el('h4', '', cat ? (state.lang === 'ru' ? cat.ru : cat.en) : ''))
    stub.appendChild(el('p', '', tr('stub')))
    root.appendChild(stub)
    return
  }
  root.appendChild(el('h4', '', tr('pageTitle')))
  const row = el('div', 'switch-row')
  row.appendChild(el('span', 'switch-label', tr('mode')))
  const toggle = el('button', 'switch')
  toggle.type = 'button'
  toggle.id = 'mode'
  toggle.setAttribute('role', 'switch')
  toggle.setAttribute('aria-checked', String(state.enabled))
  toggle.setAttribute('aria-label', tr('modeSwitch'))
  toggle.addEventListener('click', () => {
    state.enabled = !state.enabled
    apply()
  })
  row.appendChild(toggle)
  root.appendChild(row)
  root.appendChild(el('p', 'switch-note', tr('modeNote')))
  if (!state.enabled) root.appendChild(el('p', 'switch-note', tr('modeOff')))
  if (state.live) root.appendChild(el('p', 'live', state.live))

  const harness = el('section', 'section')
  harness.appendChild(el('h6', '', tr('harnessTitle')))
  if (state.turning) harness.appendChild(el('p', 'turn-note', tr('turnNote')))
  const group = el('div')
  group.setAttribute('role', 'radiogroup')
  group.setAttribute('aria-label', tr('radios'))
  ;['opencode', 'pi', 'cursor'].forEach((id) => group.appendChild(renderCard(id)))
  harness.appendChild(group)
  root.appendChild(harness)

  const shell = el('section', 'section')
  shell.appendChild(el('h6', '', tr('shellTitle')))
  const shellLabel = el('label', 'field', tr('shell'))
  shellLabel.htmlFor = 'shell'
  shell.appendChild(shellLabel)
  const shellInput = document.createElement('input')
  shellInput.id = 'shell'
  shellInput.className = 'shell-input'
  shellInput.type = 'text'
  shellInput.value = state.shell
  shellInput.placeholder = tr('shellPh')
  shellInput.spellcheck = false
  shellInput.addEventListener('input', () => { state.shell = shellInput.value })
  shell.appendChild(shellInput)
  root.appendChild(shell)
  root.appendChild(el('p', 'help', tr('help')))
}

function apply() {
  document.documentElement.dataset.theme = state.theme
  applyI18n()
  renderCats()
  renderPage()
  const key = { ready: 'stReady', missing: 'stMissing', nomodels: 'stNoModels', turn: 'stTurn' }[state.scene]
  $('status').textContent = tr(key)
}

function setScene(name) {
  const preset = JSON.parse(JSON.stringify(PRESETS[name]))
  state.scene = name
  state.page = 'agent'
  state.enabled = true
  state.shell = ''
  state.active = preset.active
  state.turning = preset.turning
  state.cards = preset.cards
  state.live = ''
  apply()
}

document.querySelectorAll('[data-scene]').forEach((node) => {
  node.addEventListener('click', () => setScene(node.getAttribute('data-scene')))
})
$('theme-light').addEventListener('click', () => {
  state.theme = 'light'
  persist('mt-mockup-theme', 'light')
  apply()
})
$('theme-dark').addEventListener('click', () => {
  state.theme = 'dark'
  persist('mt-mockup-theme', 'dark')
  apply()
})
$('lang-ru').addEventListener('click', () => {
  state.lang = 'ru'
  persist('mt-mockup-lang', 'ru')
  apply()
})
$('lang-en').addEventListener('click', () => {
  state.lang = 'en'
  persist('mt-mockup-lang', 'en')
  apply()
})
$('q').addEventListener('input', () => {
  state.query = $('q').value
  renderCats()
})

setScene('ready')
</script>
</body>
</html>
