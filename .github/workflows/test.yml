name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # packages/muya (TS v2) has its own test workflows (muya-test, muya-spec).
    # Skip the desktop unit tests on muya-only PRs.
    paths-ignore:
      - 'packages/muya/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # F-12: both OSes run the full unit suite, including the agent bridge
      # (agent-bridge-server, agent-bridge-entry), pty (agent-pty-manager), and
      # path tests (agent-harness-registry, agent-git-service). Agent e2e stays
      # on the Linux workflow.
      - name: Run Unit Tests
        run: pnpm test
