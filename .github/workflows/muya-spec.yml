name: Muya Spec (CommonMark + GFM)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/muya/src/**'
      - 'packages/muya/test/**'
      - 'packages/muya/package.json'
      - 'packages/muya/vite.config.ts'
      - 'packages/muya/vitest.spec.config.ts'
      - 'packages/muya/vitest.inline-spec.config.ts'
      - 'packages/muya/tsconfig.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/muya-spec.yml'

# Spec suite runs ~670 fixtures; give it a dedicated concurrency group so
# repeated pushes do not pile up but do not cancel sibling muya workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run CommonMark + GFM conformance suites
        run: pnpm -C packages/muya test:spec

      - name: Typecheck the live inline spec harness
        run: pnpm -C packages/muya test:inline-spec:types

      - name: Compare the live inline lexer against CommonMark + GFM
        run: pnpm -C packages/muya test:inline-spec

      - name: Upload live inline differences
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inline-spec-differences
          path: packages/muya/test-results/inline-spec/
          if-no-files-found: ignore
